<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가계부</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1f8a5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<style>
  :root { --bg:#f4f6f5; --card:#fff; --fg:#1b1f1d; --muted:#6b736f; --line:#e3e7e5; --accent:#1f8a5b; --in:#1f6fd1; --out:#d14343; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111413; --card:#1b201e; --fg:#e8ecea; --muted:#9aa39f; --line:#2b322f; --in:#6aa8ff; --out:#ff7b7b; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); max-width:560px; margin-inline:auto; }
  header { display:flex; align-items:center; gap:8px; padding:14px 0 8px; }
  header h1 { font-size:20px; margin:0; flex:1; white-space:nowrap; }
  input, select, button { font:inherit; color:inherit; }
  input, select { width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--card); min-width:0; }
  button { border:0; border-radius:10px; padding:10px 14px; background:var(--line); cursor:pointer; }
  .primary { background:var(--accent); color:#fff; font-weight:600; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin:12px 0; }
  .sum { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
  .sum small { color:var(--muted); display:block; }
  .sum b { font-size:15px; }
  .in { color:var(--in); } .out { color:var(--out); }
  form { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  form .full { grid-column:1/-1; }
  .seg { display:flex; gap:6px; } .seg label { flex:1; }
  .seg input { position:absolute; opacity:0; width:1px; height:1px; }
  .seg input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; } .seg span { display:block; text-align:center; padding:10px; border-radius:10px; background:var(--line); }
  .seg input:checked + span { background:var(--accent); color:#fff; font-weight:600; }
  ul { list-style:none; margin:0; padding:0; }
  #cats li { display:grid; grid-template-columns:80px 1fr auto; gap:8px; align-items:center; padding:4px 0; font-size:14px; }
  .bar { height:8px; border-radius:4px; background:linear-gradient(90deg, var(--out) var(--w), var(--line) var(--w)); }
  #list li { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  #list li:last-child { border:0; }
  #list div { flex:1; min-width:0; } #list small { color:var(--muted); display:block; font-size:12px; }
  #list span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #list button { background:none; color:var(--muted); padding:4px 8px; font-size:18px; }
  .empty { color:var(--muted); text-align:center; padding:12px 0 !important; display:block !important; }
  #status { color:var(--muted); font-size:12px; text-align:center; min-height:1.4em; }
  dialog { border:0; border-radius:14px; background:var(--card); color:var(--fg); width:min(92vw,420px); }
  dialog label { display:block; margin:10px 0; font-size:14px; }
  h2 { font-size:15px; margin:0 0 8px; }
</style>
</head>
<body>
<header>
  <h1>가계부</h1>
  <input id="month" type="month" style="width:auto" aria-label="월 선택">
  <button id="reload" aria-label="새로고침">⟳</button>
  <button id="openSettings" aria-label="설정">⚙</button>
</header>
<p id="status" role="status"></p>

<section class="card sum">
  <div><small>수입</small><b id="inc" class="in">0원</b></div>
  <div><small>지출</small><b id="exp" class="out">0원</b></div>
  <div><small>잔액</small><b id="bal">0원</b></div>
</section>

<section class="card">
  <form id="form">
    <div class="seg full">
      <label><input type="radio" name="type" value="지출" checked><span>지출</span></label>
      <label><input type="radio" name="type" value="수입"><span>수입</span></label>
    </div>
    <input name="date" type="date" required aria-label="날짜">
    <select name="category" aria-label="카테고리"></select>
    <input class="full" name="amount" type="number" inputmode="numeric" min="1" step="1" placeholder="금액" required aria-label="금액">
    <input class="full" name="memo" placeholder="메모 (선택)" maxlength="200" aria-label="메모">
    <button class="primary full">추가</button>
  </form>
</section>

<section class="card"><h2>카테고리별 지출</h2><ul id="cats"></ul></section>
<section class="card"><h2>내역</h2><ul id="list"></ul></section>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>구글 시트 연결</h2>
    <label>Apps Script 웹 앱 URL<input name="url" type="url" placeholder="https://script.google.com/macros/s/.../exec" required></label>
    <label>비밀번호 (Code.gs의 TOKEN)<input name="token" type="password" required></label>
    <div style="display:flex; gap:8px; justify-content:flex-end">
      <button value="cancel" formnovalidate>취소</button>
      <button class="primary" value="save">저장</button>
    </div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
