# 모든 푸시·PR에서 전체 테스트(bash tests/run.sh). 시트·친구 서버 배포는 이 테스트가 통과해야만 진행됨 (workflow_call로 불러 씀)
name: 테스트
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 테스트 도구 설치 (Playwright·크로미움, 친구 서버 테스트 도구)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          (cd worker && npm ci)
      - name: 전체 테스트
        env:
          TZ: Asia/Seoul
        run: bash tests/run.sh
