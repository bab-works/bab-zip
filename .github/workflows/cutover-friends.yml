name: 친구 서버 전환 (4단계)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cutover-friends.yml']
permissions:
  contents: read
concurrency:
  group: deploy-gas
  cancel-in-progress: false
jobs:
  copy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 가짜 데이터로 이전 검증
        run: node tests/migration.mjs
      - name: 최종 복사·접속 전환·운영 확인
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_DATABASE: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          BRIDGE: ${{ secrets.FRIENDS_BRIDGE_SECRET }}
        run: node migration/cutover.mjs
